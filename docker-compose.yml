# A seção 'services' define todos os containers que vão compor a nossa infraestrutura.
services:

  # Criamos o nosso primeiro serviço (container) e damos o nome de 'learning_docker_web'.
  # Este será o container da nossa aplicação Django.
  learning_docker_web:
    
    # 'build: .' avisa o Docker Compose para construir a imagem usando o Dockerfile que está na pasta atual.
    build: .
    
    # 'restart: always' garante que, se o container der erro ou o computador reiniciar, ele vai tentar subir novamente de forma automática.
    restart: always
    
    # 'ports' faz o mapeamento das portas de rede.
    ports:
      # '8000:8000' significa que o tráfego da porta 8000 do seu computador será enviado para a porta 8000 de dentro do container.
      - 8000:8000
      
    # 'depends_on' cria uma regra de ordem de inicialização.
    depends_on:
      # Isso diz que a nossa aplicação web só deve ser iniciada DEPOIS que o banco de dados ('learning_docker_db') estiver rodando.
      - learning_docker_db

  # Criamos o nosso segundo serviço, que é o container do banco de dados.
  learning_docker_db:
    
    # Em vez de construir com 'build', aqui baixamos a imagem oficial pronta do PostgreSQL na versão 18.6 diretamente da internet.
    image: postgres:18.6
    
    # Novamente, mapeamos a porta de acesso.
    ports:
      # '5432:5432' mapeia a porta oficial do Postgres do seu computador para o container.
      - 5432:5432
      
    # 'volumes' (corrigido do seu original 'valumes') serve para salvar os dados permanentemente.
    # Se não usarmos isso, ao desligar o container, todos os dados do banco são apagados.
    volumes:
      # Mapeia o volume chamado 'postgres_data' para a pasta interna do container onde o Postgres guarda os arquivos reais.
      - postgres_data:/var/lib/postgresql/data/
      
    # 'environment' serve para passar variáveis de configuração ocultas para dentro do container do banco.
    environment:
      # Define o nome do usuário administrador do banco de dados (corrigido de 'postegres').
      - POSTGRES_USER=postgres
      
      # Define a senha do usuário administrador (corrigido de 'POSTGRES_PASSWORK').
      - POSTGRES_PASSWORD=postgres
      
      # Diz ao Postgres para criar automaticamente um banco de dados com esse nome ao ligar a primeira vez (corrigido de 'POSTEGRES_DB').
      - POSTGRES_DB=learning_docker_db

# Esta seção externa declara os volumes que criamos lá em cima.
volumes:
  # Aqui apenas confirmamos a criação do volume 'postgres_data', permitindo que o Docker gerencie o armazenamento no seu disco rígido de forma segura.
  postgres_data:
